<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GTA Vice City - Web</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <h1>GTA Vice City</h1>
            <p>Loading...</p>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="status-text">Initializing...</p>
        </div>
    </div>
    
    <div id="error-screen" class="error-screen" style="display:none;">
        <div class="error-content">
            <h1>Error</h1>
            <p id="error-message"></p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </div>
    
    <div id="mobile-controls" class="mobile-controls">
        <div class="left-stick" id="left-stick">
            <div class="stick-bg">
                <div class="stick-circle"></div>
            </div>
        </div>
        <div class="right-area" id="right-area"></div>
        <div class="button-group">
            <button class="action-btn" id="jump-btn" data-action="jump">JUMP</button>
            <button class="action-btn" id="fire-btn" data-action="fire">FIRE</button>
            <button class="action-btn" id="enter-btn" data-action="enter">ENTER</button>
            <button class="action-btn" id="sprint-btn" data-action="sprint">SPRINT</button>
            <button class="menu-btn" id="menu-btn">MENU</button>
        </div>
    </div>
    
    <script async type="text/javascript" src="re3_web.js"></script>
    <script src="gamepad.js"></script>
    <script src="controls.js"></script>
    <script src="audio.js"></script>
    <script src="bootstrap.js"></script>
</body>
</html>
